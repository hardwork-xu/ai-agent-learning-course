name: Learning material checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_exercises.py
      - run: python scripts/grade.py --submission exercises/reference.py
      - run: python scripts/smoke_service.py
      - run: python -m agentlab.rag_eval --output work/zh-evaluation.json
      - run: python scripts/check_docs.py
      - run: python scripts/check_public_content.py
      - run: python -m agentlab demo tools
      - run: python -m agentlab demo rag
      - run: python -m agentlab demo workflow
      - run: python -m agentlab evaluate --output work/evaluation.json
