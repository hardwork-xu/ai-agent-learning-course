[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-learning-lab"
version = "0.1.0"
description = "Inspectable, offline-first exercises for tool agents, retrieval and approval workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentlab = "agentlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentlab = ["fixtures/*.json"]
