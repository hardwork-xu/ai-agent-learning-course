[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-learning-lab"
version = "0.2.0"
description = "Agent application engineering course with student grading, Chinese RAG and a durable teaching service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentlab = "agentlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentlab = ["fixtures/*.json"]
